[ids]
*

[main]
# Caps Lock dual-function:
# tap  -> Esc
# hold -> Ctrl
capslock = overload(control, esc)

# Esc becomes Caps Lock
esc = capslock

# Alt keys become Super (Windows)
leftalt  = leftmeta
rightalt = rightmeta

# Super (Windows) becomes Alt
leftmeta  = leftalt
rightmeta = rightalt

# Menu / Application key becomes Alt
compose = leftalt

