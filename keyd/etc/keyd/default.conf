[ids]
*

[settings]
enable_atkbd = true

[main]
# Caps Lock dual-function:
# tap  -> Esc
# hold -> Ctrl
capslock = overload(control, esc)

# Esc becomes Caps Lock
esc = capslock

# Menu / Application key becomes Alt
compose = leftalt

[alt]
# Super (Windows) becomes Alt when Alt is held
leftmeta = leftalt
rightmeta = rightalt

